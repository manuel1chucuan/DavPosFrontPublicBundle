<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="bg" x1="960" y1="0" x2="960" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="0.45" stop-color="#312e81"/>
      <stop offset="1" stop-color="#581c5c"/>
    </linearGradient>
    <linearGradient id="glow" x1="960" y1="220" x2="960" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="760" y1="300" x2="1160" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <ellipse cx="960" cy="520" rx="520" ry="280" fill="url(#glow)" filter="url(#soft)"/>

  <g transform="translate(960 430)">
    <rect x="-250" y="-120" width="500" height="320" rx="24" fill="#0f172a" fill-opacity="0.55" stroke="#cbd5e1" stroke-opacity="0.25" stroke-width="4"/>
    <rect x="-220" y="-90" width="440" height="250" rx="12" fill="url(#screen)" fill-opacity="0.9"/>
    <rect x="-180" y="-50" width="120" height="10" rx="5" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="-180" y="-24" width="220" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="-180" y="2" width="180" height="10" rx="5" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="-60" y="120" width="120" height="14" rx="7" fill="#94a3b8" fill-opacity="0.8"/>
    <rect x="-130" y="150" width="260" height="18" rx="9" fill="#334155"/>
    <rect x="-90" y="186" width="180" height="8" rx="4" fill="#64748b"/>
  </g>

  <text x="960" y="760" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="112" font-weight="700" letter-spacing="4">Davai Pos</text>
  <text x="960" y="820" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="34" font-weight="500" letter-spacing="8">PUNTO DE VENTA</text>
</svg>
