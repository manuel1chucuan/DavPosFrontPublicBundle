  <style id="kc-bg-critical">
    html.kc-bg-pending body {
      background-image: none !important;
      background-color: var(--kc-bg-pending-color, #0f172a);
    }
    html.kc-bg-ready body {
      background-image: var(--kc-body-bg-image);
      background-size: var(--kc-body-bg-size, cover);
      background-repeat: no-repeat;
      background-position: var(--kc-body-bg-position, center);
    }
  </style>
  <script>
    (function () {
      var DEFAULT_IMG = 'assets/backgrounds/davai-pos-default.svg';
      var STORAGE_KEY = 'kc-app-bg-config';
      var THEME_KEY = 'kc-app-theme-config';
      var LEGACY_THEME_KEY = 'kc-app-theme';
      var root = document.documentElement;

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      try {
        var themeRaw = localStorage.getItem(THEME_KEY);
        if (themeRaw) {
          var themeCfg = JSON.parse(themeRaw);
          if (themeCfg && (themeCfg.mode === 'light' || themeCfg.mode === 'dark')) {
            root.setAttribute('data-theme', themeCfg.mode);
            if (themeCfg.palette) {
              root.setAttribute('data-palette', themeCfg.palette);
            }
          }
        } else {
          var legacyTheme = localStorage.getItem(LEGACY_THEME_KEY);
          if (legacyTheme === 'light' || legacyTheme === 'dark') {
            root.setAttribute('data-theme', legacyTheme);
            root.setAttribute('data-palette', 'normal');
          }
        }
      } catch (e) {}

      function readBgConfig() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            return { source: 'default', positionX: 50, positionY: 50, zoom: 100 };
          }

          var cfg = JSON.parse(raw);
          if (cfg
            && (cfg.source === 'default' || cfg.source === 'custom')
            && typeof cfg.positionX === 'number'
            && typeof cfg.positionY === 'number'
            && typeof cfg.zoom === 'number') {
            return {
              source: cfg.source === 'custom' ? 'custom' : 'default',
              positionX: clamp(cfg.positionX, 0, 100),
              positionY: clamp(cfg.positionY, 0, 100),
              zoom: clamp(cfg.zoom, 60, 220)
            };
          }
        } catch (e) {}

        return { source: 'default', positionX: 50, positionY: 50, zoom: 100 };
      }

      function applyBackground(url, cfg) {
        var safeUrl = String(url).replace(/"/g, '\\"');
        var size = cfg.zoom === 100 ? 'cover' : cfg.zoom + '%';
        root.style.setProperty('--kc-body-bg-image', 'url("' + safeUrl + '")');
        root.style.setProperty('--kc-body-bg-position', cfg.positionX + '% ' + cfg.positionY + '%');
        root.style.setProperty('--kc-body-bg-size', size);
        root.classList.add('kc-bg-ready');
        root.classList.remove('kc-bg-pending');
      }

      var bgCfg = readBgConfig();
      if (bgCfg.source === 'custom') {
        var pendingColor = root.getAttribute('data-theme') === 'dark' ? '#0f172a' : '#f3f6fb';
        root.style.setProperty('--kc-bg-pending-color', pendingColor);
        root.classList.add('kc-bg-pending');
        root.classList.remove('kc-bg-ready');
      } else {
        applyBackground(DEFAULT_IMG, bgCfg);
      }
    })();
  </script>
